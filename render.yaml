# Blueprint de Render para la API de TechDrop.
# Docs: https://render.com/docs/blueprint-spec
services:
    - type: web
      name: techdrop-backend
      runtime: python
      region: frankfurt
      plan: free
      buildCommand: "./render_build.sh"
      startCommand: "gunicorn wsgi --chdir ./src/"
      healthCheckPath: /api/health
      envVars:
          - key: PYTHON_VERSION
            value: 3.12.7
          - key: FLASK_APP
            value: src/app.py
          - key: FLASK_DEBUG
            value: 0
          - key: JWT_SECRET_KEY
            generateValue: true
          # Opcional: URL de una base PostgreSQL que no caduque (Neon, Supabase…).
          # Sin ella se usa SQLite, que se vuelve a sembrar sola con el catálogo en cada arranque.
          - key: DATABASE_URL
            sync: false
          # Opcional: fotos de producto en Neon Object Storage (bucket "assets").
          # Copia los valores de .env.local tras `neon deploy`.
          - key: AWS_ACCESS_KEY_ID
            sync: false
          - key: AWS_SECRET_ACCESS_KEY
            sync: false
          - key: AWS_ENDPOINT_URL_S3
            sync: false
          - key: AWS_REGION
            sync: false
          # Opcional: crea un administrador al arrancar.
          - key: ADMIN_EMAIL
            sync: false
          - key: ADMIN_PASSWORD
            sync: false
          - key: CORS_ORIGINS
            value: https://cozy-frangipane-33a56e.netlify.app
